# Nginx site for PixelPilot. Replace pixelpilot.example.com and the PHP-FPM
# socket path for your server. TLS certificates come from certbot:
#   sudo certbot --nginx -d pixelpilot.example.com

server {
    listen 80;
    listen [::]:80;
    server_name pixelpilot.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pixelpilot.example.com;

    root /var/www/pixelpilot/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/pixelpilot.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pixelpilot.example.com/privkey.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    charset utf-8;
    client_max_body_size 2m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.svg { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        # Pixelforge waits 10s for a webhook response; we answer in well under that.
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
