; Queue workers for PixelPilot (webhook processing, submission retries,
; polling, image copies). Install to /etc/supervisor/conf.d/ and run:
;   sudo supervisorctl reread && sudo supervisorctl update
;
; Jobs set their own tries/backoff, so the worker doesn't pass --tries.
; --max-time recycles workers hourly so they pick up new code and free memory;
; the deploy script also runs `php artisan queue:restart`.

[program:pixelpilot-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/pixelpilot/artisan queue:work --sleep=1 --max-time=3600 --timeout=90
directory=/var/www/pixelpilot
user=www-data
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=/var/www/pixelpilot/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
